<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Word Grid</title>
  <meta name="description" content="A Boggle-style word game with an adaptive coach. No ads.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Word Grid">
  <meta name="theme-color" content="#14213d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Home -->
  <section id="home" class="screen active">
    <header class="brand">
      <div class="logo" aria-hidden="true"><span>W</span><span>O</span><span>R</span><span>D</span></div>
      <h1>Word Grid</h1>
    </header>

    <div class="play-buttons">
      <button id="play-coach" class="btn primary big" disabled>
        <span class="btn-title">Play the Coach</span>
        <span class="btn-sub" id="coach-sub">Loading dictionary…</span>
      </button>
      <button id="play-free" class="btn secondary big" disabled>
        <span class="btn-title">Free Play</span>
        <span class="btn-sub">Just you and the clock</span>
      </button>
    </div>

    <div class="settings">
      <div class="setting">
        <span class="label">Board</span>
        <div class="seg" data-setting="size">
          <button data-value="4">4×4</button>
          <button data-value="5">5×5</button>
        </div>
      </div>
      <div class="setting">
        <span class="label">Time</span>
        <div class="seg" data-setting="duration">
          <button data-value="90">1:30</button>
          <button data-value="120">2:00</button>
          <button data-value="180">3:00</button>
        </div>
      </div>
      <div class="setting">
        <span class="label">Coach</span>
        <div class="seg" data-setting="challenge">
          <button data-value="relaxed">Relaxed</button>
          <button data-value="even">Even</button>
          <button data-value="tough">Tough</button>
        </div>
      </div>
      <div class="setting">
        <span class="label">Sound</span>
        <div class="seg" data-setting="sound">
          <button data-value="on">On</button>
          <button data-value="off">Off</button>
        </div>
      </div>
    </div>

    <div class="stats" id="stats"></div>
    <p class="fine">Tap “Share → Add to Home Screen” in Safari to install.</p>
  </section>

  <!-- Game -->
  <section id="game" class="screen">
    <div class="hud">
      <button id="quit" class="icon-btn" aria-label="Quit round">✕</button>
      <div class="timer" id="timer">3:00</div>
      <button id="pause" class="icon-btn" aria-label="Pause">❚❚</button>
    </div>
    <div class="scores" id="scores">
      <div class="score you"><span class="who">You</span><span id="you-score">0</span><span class="count" id="you-count">0 words</span></div>
      <div class="score coach" id="coach-box"><span class="who">Coach</span><span id="coach-score">0</span><span class="count" id="coach-count">0 words</span></div>
    </div>
    <div class="current" id="current"><span id="current-word"></span><span id="current-pts"></span></div>
    <div class="board-wrap">
      <div class="board" id="board"></div>
      <svg class="trace" id="trace" aria-hidden="true"><polyline id="trace-line" points=""/></svg>
    </div>
    <div class="found" id="found"></div>
    <div class="overlay" id="paused" hidden>
      <div class="overlay-card">
        <h2>Paused</h2>
        <button id="resume" class="btn primary">Resume</button>
      </div>
    </div>
    <div class="overlay" id="countdown" hidden><div class="count-big" id="count-big">3</div></div>
  </section>

  <!-- Results -->
  <section id="results" class="screen">
    <div class="result-head">
      <h2 id="result-title">Nice round</h2>
      <p id="result-sub"></p>
      <div class="result-scores" id="result-scores"></div>
    </div>
    <div class="mini-wrap"><div class="board mini" id="mini-board"></div></div>
    <p class="fine center" id="mini-hint">Tap any word to see it on the board.</p>
    <div class="tabs" id="tabs">
      <button data-tab="yours" class="active">Yours</button>
      <button data-tab="coach" id="tab-coach">Coach</button>
      <button data-tab="missed">Missed</button>
    </div>
    <div class="word-list" id="word-list"></div>
    <div class="result-actions">
      <button id="again" class="btn primary">Play again</button>
      <button id="home-btn" class="btn secondary">Home</button>
    </div>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
